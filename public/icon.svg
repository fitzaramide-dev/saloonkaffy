<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Hot-Pink Glamour Gradient -->
    <linearGradient id="glamPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A85" />
      <stop offset="50%" stop-color="#E91E63" />
      <stop offset="100%" stop-color="#9C0847" />
    </linearGradient>

    <!-- Warm Gold Gradient for Crown & Sparkles -->
    <linearGradient id="regalGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Drop Shadow for Dimensionality -->
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3B091E" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Badge -->
  <rect width="512" height="512" rx="128" fill="url(#glamPinkGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="6" />

  <!-- Sparkling Crown -->
  <g filter="url(#softGlow)">
    <path d="M 180 145 L 215 105 L 256 135 L 297 105 L 332 145 L 310 165 L 202 165 Z" fill="url(#regalGoldGrad)" />
    <circle cx="215" cy="98" r="9" fill="url(#regalGoldGrad)" />
    <circle cx="256" cy="126" r="10" fill="url(#regalGoldGrad)" />
    <circle cx="297" cy="98" r="9" fill="url(#regalGoldGrad)" />
  </g>

  <!-- Left Sparkle -->
  <path d="M 115 130 Q 115 150 95 150 Q 115 150 115 170 Q 115 150 135 150 Q 115 150 115 130 Z" fill="#FFFFFF" opacity="0.95" />

  <!-- Right Sparkle -->
  <path d="M 395 130 Q 395 150 375 150 Q 395 150 395 170 Q 395 150 415 150 Q 395 150 395 130 Z" fill="#FFFFFF" opacity="0.95" />

  <!-- Monogram Letter K (Serif Elegance) -->
  <text x="256" y="380" font-family="Georgia, 'Playfair Display', 'Times New Roman', serif" font-size="255" font-weight="bold" text-anchor="middle" fill="#FFFFFF" filter="url(#softGlow)">K</text>

  <!-- Salon Pill Label -->
  <rect x="156" y="420" width="200" height="34" rx="17" fill="rgba(255, 255, 255, 0.22)" />
  <text x="256" y="443" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="4">SALOON</text>
</svg>
